name: Build Inline Baseline Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        required: true
        default: greatlte
        type: choice
        options:
          - dreamlte
          - dream2lte
          - greatlte

permissions:
  contents: read

concurrency:
  group: inline-baseline-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: true

jobs:
  build:
    name: Inline Baseline ${{ inputs.device }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEVICE: ${{ inputs.device }}
      HOST_FLAGS: >-
        -Wall
        -Wmissing-prototypes
        -Wstrict-prototypes
        -O2
        -fomit-frame-pointer
        -std=gnu89
        -Wno-dangling-pointer
        -fcommon

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set toolchain environment
        run: |
          echo "TOOLCHAIN=${{ runner.tool_cache }}/gcc-aarch64-4.9" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libncurses5 \
            libssl-dev \
            python3 \
            unzip \
            zip \
            file

      - name: Restore LineageOS GCC 4.9 cache
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN }}
          key: lineage-gcc-aarch64-4.9-v1

      - name: Download LineageOS GCC 4.9
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          git clone \
            --depth=1 \
            --branch=lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$TOOLCHAIN"

      - name: Verify toolchain
        run: |
          test -x "$TOOLCHAIN/bin/aarch64-linux-android-gcc"
          "$TOOLCHAIN/bin/aarch64-linux-android-gcc" --version

      - name: Prepare KernelSU exactly as repository expects
        run: |
          git submodule update --init --recursive

          if [ ! -e drivers/kernelsu ] && [ ! -L drivers/kernelsu ]; then
            ln -s ../KernelSU/kernel drivers/kernelsu
          fi

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU path:"
          ls -ld drivers/kernelsu
          echo "KernelSU submodule:"
          git submodule status || true

      - name: Patch old Perl syntax
        run: |
          if [ -f kernel/timeconst.pl ]; then
            sed -i 's/defined(@val)/@val/g' kernel/timeconst.pl
          fi

      - name: Clean source tree
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          make mrproper

          if [ ! -e drivers/kernelsu ] && [ ! -L drivers/kernelsu ]; then
            ln -s ../KernelSU/kernel drivers/kernelsu
          fi

      - name: Configure kernel inline
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          make \
            HOSTCFLAGS="$HOST_FLAGS" \
            "exynos8895-${DEVICE}_defconfig"

          echo "Original scheduler configuration:"
          grep -E \
            'CONFIG_IOSCHED_MAPLE|CONFIG_DEFAULT_MAPLE|CONFIG_DEFAULT_CFQ|CONFIG_DEFAULT_NOOP|CONFIG_DEFAULT_IOSCHED' \
            .config || true

          if grep -q '^CONFIG_IOSCHED_MAPLE=' .config; then
            sed -i \
              's/^CONFIG_IOSCHED_MAPLE=.*/# CONFIG_IOSCHED_MAPLE is not set/' \
              .config
          elif ! grep -q '^# CONFIG_IOSCHED_MAPLE is not set' .config; then
            echo '# CONFIG_IOSCHED_MAPLE is not set' >> .config
          fi

          if grep -q '^CONFIG_DEFAULT_MAPLE=' .config; then
            sed -i \
              's/^CONFIG_DEFAULT_MAPLE=.*/# CONFIG_DEFAULT_MAPLE is not set/' \
              .config
          fi

          make \
            HOSTCFLAGS="$HOST_FLAGS" \
            olddefconfig

          echo "Final scheduler configuration:"
          grep -E \
            'CONFIG_IOSCHED_MAPLE|CONFIG_DEFAULT_MAPLE|CONFIG_DEFAULT_CFQ|CONFIG_DEFAULT_NOOP|CONFIG_DEFAULT_IOSCHED' \
            .config || true

          if grep -q '^CONFIG_IOSCHED_MAPLE=y' .config; then
            echo "ERROR: Maple is still enabled."
            exit 1
          fi

          if grep -q '^CONFIG_DEFAULT_MAPLE=y' .config; then
            echo "ERROR: Maple is still configured as default."
            exit 1
          fi

          echo "Device configuration:"
          grep -E \
            'CONFIG_MACH_EXYNOS8895|CONFIG_SOC_EXYNOS8895|CONFIG_LOCALVERSION' \
            .config || true

      - name: Build kernel inline
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            HOSTCFLAGS="$HOST_FLAGS"

      - name: Verify build products
        run: |
          IMAGE="arch/arm64/boot/Image"
          IMAGE_GZ="arch/arm64/boot/Image.gz"
          DTB="arch/arm64/boot/dtb.img"

          test -s "$IMAGE_GZ"

          echo "Kernel build products:"
          ls -lh "$IMAGE" "$IMAGE_GZ" 2>/dev/null || true

          if [ -s "$DTB" ]; then
            echo "dtb.img was generated but WILL NOT be flashed:"
            ls -lh "$DTB"
          fi

          echo "File types:"
          file "$IMAGE" "$IMAGE_GZ" 2>/dev/null || true

          echo "Kernel image hashes:"
          sha256sum "$IMAGE_GZ"

      - name: Verify Maple was not built
        run: |
          if [ -e block/maple-iosched.o ]; then
            echo "ERROR: Maple object exists even though Maple should be disabled."
            ls -lh block/maple-iosched.o
            exit 1
          fi

          if grep -q '^CONFIG_IOSCHED_MAPLE=y' .config; then
            echo "ERROR: CONFIG_IOSCHED_MAPLE=y found after build."
            exit 1
          fi

          echo "Confirmed: Maple was not compiled."

      - name: Prepare device information
        run: |
          case "$DEVICE" in
            dreamlte)
              MODEL="Samsung Galaxy S8"
              DEVICE_ALIAS="dreamltexx"
              ;;
            dream2lte)
              MODEL="Samsung Galaxy S8+"
              DEVICE_ALIAS="dream2ltexx"
              ;;
            greatlte)
              MODEL="Samsung Galaxy Note8"
              DEVICE_ALIAS="greatltexx"
              ;;
            *)
              echo "Unknown device: $DEVICE"
              exit 1
              ;;
          esac

          BOOT_BLOCK="/dev/block/platform/11120000.ufs/by-name/BOOT"

          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "DEVICE_ALIAS=$DEVICE_ALIAS" >> "$GITHUB_ENV"
          echo "BOOT_BLOCK=$BOOT_BLOCK" >> "$GITHUB_ENV"
          echo "ZIP_NAME=Inline-Baseline-${DEVICE}-${GITHUB_RUN_NUMBER}.zip" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3
        run: |
          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf \
            AnyKernel3/.git \
            AnyKernel3/.github

          cp arch/arm64/boot/Image.gz AnyKernel3/Image.gz

          rm -f \
            AnyKernel3/dtb \
            AnyKernel3/dtb.img \
            AnyKernel3/dtbo \
            AnyKernel3/dtbo.img

          cat > AnyKernel3/anykernel.sh <<'ANYKERNEL'
          ### AnyKernel3
          ## Inline baseline test for Samsung Exynos 8895

          properties() { '
          kernel.string=Inline Baseline Kernel for @MODEL@
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=@DEVICE@
          device.name2=@DEVICE_ALIAS@
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
              :
          }

          BLOCK=@BOOT_BLOCK@
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=0

          . tools/ak3-core.sh

          ui_print " "
          ui_print "======================================"
          ui_print " Exynos8895 Inline Baseline Kernel"
          ui_print "======================================"
          ui_print "Device: @DEVICE@"
          ui_print "Model:  @MODEL@"
          ui_print "Boot:   $BLOCK"
          ui_print " "
          ui_print "Build: inline / LOS GCC 4.9"
          ui_print "Maple: disabled"
          ui_print "DTB:   preserved from current boot"
          ui_print " "

          dump_boot
          write_boot
          ANYKERNEL

          sed -i "s|@BOOT_BLOCK@|$BOOT_BLOCK|g" AnyKernel3/anykernel.sh
          sed -i "s/@DEVICE_ALIAS@/$DEVICE_ALIAS/g" AnyKernel3/anykernel.sh
          sed -i "s/@DEVICE@/$DEVICE/g" AnyKernel3/anykernel.sh
          sed -i "s/@MODEL@/$MODEL/g" AnyKernel3/anykernel.sh

          chmod 755 AnyKernel3/anykernel.sh
          chmod 755 AnyKernel3/META-INF/com/google/android/update-binary

      - name: Validate AnyKernel3 package
        run: |
          test -s AnyKernel3/Image.gz
          test -s AnyKernel3/anykernel.sh
          test -s AnyKernel3/tools/ak3-core.sh
          test -s AnyKernel3/META-INF/com/google/android/update-binary

          test ! -e AnyKernel3/dtb
          test ! -e AnyKernel3/dtb.img
          test ! -e AnyKernel3/dtbo
          test ! -e AnyKernel3/dtbo.img

          grep -F "device.name1=$DEVICE" AnyKernel3/anykernel.sh
          grep -F "device.name2=$DEVICE_ALIAS" AnyKernel3/anykernel.sh
          grep -F "BLOCK=$BOOT_BLOCK" AnyKernel3/anykernel.sh

          echo "AnyKernel3 package validation passed."

      - name: Create flashable ZIP
        run: |
          mkdir -p release

          cd AnyKernel3

          zip -r9 "../release/$ZIP_NAME" . \
            -x '.git/*' \
               '.github/*' \
               'README.md' \
               '*placeholder*'

          cd ..

          test -s "release/$ZIP_NAME"

          echo "Flash ZIP:"
          ls -lh "release/$ZIP_NAME"

          echo "Important ZIP contents:"
          unzip -l "release/$ZIP_NAME" | grep -E \
            'META-INF/com/google/android/(update-binary|updater-script)|Image.gz|anykernel.sh|tools/ak3-core.sh'

          echo "Checking that no replacement DTB/DTBO exists:"
          if unzip -Z1 "release/$ZIP_NAME" | grep -Eq '(^|/)(dtb|dtb\.img|dtbo|dtbo\.img)$'; then
            echo "ERROR: Replacement DTB/DTBO found in ZIP."
            unzip -Z1 "release/$ZIP_NAME" | grep -E '(^|/)(dtb|dtb\.img|dtbo|dtbo\.img)$'
            exit 1
          fi

          echo "Embedded Image.gz hash:"
          unzip -p "release/$ZIP_NAME" Image.gz | sha256sum

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Inline-Baseline-${{ inputs.device }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
